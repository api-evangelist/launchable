aid: launchable
name: Launchable
description: 'Launchable is a software development intelligence platform for continuous integration
  that applies machine learning to CI and test data to speed up software delivery. Its flagship
  capability, Predictive Test Selection, records builds, test sessions and test results from a
  team''s CI pipeline and returns a prioritized subset of tests most likely to fail for a given
  change, letting teams run a fraction of a suite while retaining most of its failure-detection
  power. The platform also provides test suite parallelization, flaky/unhealthy test detection,
  trends and test reporting, and Slack and GitHub notifications. Access is CLI-mediated: the
  open-source Launchable CLI (now the CloudBees Smart Tests CLI) wraps the service REST API and
  integrates with more than twenty test runners and build tools across Java, Python, Ruby, Go,
  JavaScript, .NET and Perl. Launchable was founded by Jenkins creator Kohsuke Kawaguchi and is
  now part of CloudBees, where the product ships as CloudBees Smart Tests.'
