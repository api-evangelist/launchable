- aid: launchable:launchable-api
  name: Launchable API
  description: The Launchable (CloudBees Smart Tests) service API that the Launchable CLI calls to
    record builds, create test sessions, upload test results, request predictive test subsets and
    split subsets for parallel execution. The service is consumed through the first-party CLI
    rather than a published REST reference; the host is documented via the LAUNCHABLE_BASE_URL
    environment variable and the restricted-network allowlist guidance.
